{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Forgot Password</h2>
    <p>Enter your email address below to receive an OTP to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        <label for="id_email">Email address:</label>
        <input type="email" name="email" required id="id_email">
        <button type="submit" class="checkout-btn">Send OTP</button>
    </form>
     <p style="text-align: center; margin-top: 1rem;"><a href="{% url 'login' %}">Back to Login</a></p>
</div>
{% endblock %}
