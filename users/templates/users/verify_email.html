{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Verify Your Email</h2>
    <p>Please enter the verification code sent to {{ email }}</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_otp">Verification Code:</label>
            <input type="text" name="otp" maxlength="6" required id="id_otp" class="form-control">
        </div>
        <button type="submit" class="checkout-btn">Verify Email</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">
        Didn't receive the code? <a href="{% url 'signup' %}">Register again</a>
    </p>
</div>
{% endblock %}
