{% extends 'base.html' %}
{% block content %}
<div class="form-container">
  <h2>Reset Password</h2>
  <p>Enter your email address below, and we'll email instructions for setting a new password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.errors }}
    <p><label for="id_email">Email address:</label> {{ form.email }}</p>
    <button type="submit" class="checkout-btn">Send Reset Instructions</button>
  </form>
</div>
{% endblock %}
